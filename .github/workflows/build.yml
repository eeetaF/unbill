name: Build APK

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify buildozer.spec exists
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "Error: buildozer.spec not found!"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv git openjdk-17-jdk unzip

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$PATH" >> $GITHUB_ENV

      - name: Fix sdkmanager path for Buildozer
        run: |
          mkdir -p $ANDROID_HOME/tools/bin
          ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager

      - name: Install Android Build Tools (including AIDL)
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-31" "build-tools;31.0.0" "platform-tools"

      - name: Verify AIDL Installation
        run: |
          ls -la $ANDROID_HOME/build-tools/31.0.0/
          if [ ! -f "$ANDROID_HOME/build-tools/31.0.0/aidl" ]; then
            echo "Error: AIDL not found!"
            exit 1
          fi
      
      - name: Verify sdkmanager Installation
        run: |
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Error: sdkmanager not found!"
            exit 1
          fi
          sdkmanager --list
      
      - name: Remove old NDK versions
        run: |
          rm -rf $ANDROID_HOME/ndk/*
          rm -rf $HOME/.buildozer/android/platform/android-ndk-*
          rm -rf $HOME/.buildozer/android/platform/android-ndk-r23b

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "export ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $HOME/.bashrc
          echo "export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> $HOME/.bashrc
      
      - name: Clean Buildozer Cache
        run: |
          rm -rf .buildozer/android/platform/android-ndk-*

      - name: Set up virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Build APK
        run: |
          source venv/bin/activate
          buildozer -v android debug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
